server {
    listen 80;
    server_name landing-page-app.local;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /Main;
    }

    # Optional: cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
