<app-banner></app-banner>
<mat-toolbar class="app-toolbar">
  <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
    <mat-icon>menu</mat-icon>
  </button>
  <img src="assets/images/landing-page-logo.png" alt="Landing Page Logo" class="app-logo">
  <span class="app-title">Welcome to the Landing Page Application !!!!</span>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" [opened]="sidenavOpen()" class="app-sidenav">
    <mat-nav-list>
      <a mat-list-item
        (click)="selectFilter('All')"
        [class.active-filter]="selectedFilter() === 'All'">
        <mat-icon matListItemIcon>devices</mat-icon>
        <span matListItemTitle>All</span>
      </a>
      <mat-divider></mat-divider>
      @for (type of deviceTypes(); track type) {
        <a mat-list-item
          (click)="selectFilter(type)"
          [class.active-filter]="selectedFilter() === type">
          <mat-icon matListItemIcon>developer_board</mat-icon>
          <span matListItemTitle>{{ type }}</span>
        </a>
      }
    </mat-nav-list>
    <app-footer></app-footer>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
